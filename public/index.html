<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money AI · Panel financiero</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a24;
    --border: #2a2f3d;
    --text: #e6e8ef;
    --muted: #9aa0ae;
    --accent: #6c5ce7;
    --accent-hover: #5a4bd1;
    --positive: #2ecc71;
    --negative: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .card h1 {
    margin: 0 0 6px;
    font-size: 22px;
  }
  .card p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1117;
    color: var(--text);
    font-size: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.15s ease;
  }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .error-msg {
    color: var(--negative);
    font-size: 13px;
    margin: -8px 0 16px;
    min-height: 16px;
  }

  #dashboard {
    display: none;
    width: 100%;
    max-width: 900px;
  }
  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .dashboard-header h1 { font-size: 20px; margin: 0; }
  .btn-logout {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 14px;
  }
  .btn-logout:hover { color: var(--text); border-color: var(--muted); }

  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .actions-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .btn-load {
    background: #2b2f3d;
    color: var(--text);
    padding: 10px 18px;
    border: 1px solid var(--border);
  }
  .btn-load:hover { background: #363c4f; }
  .btn-load.active { background: var(--accent); border-color: var(--accent); }

  .btn-ai-giant {
    display: block;
    width: 100%;
    padding: 22px;
    font-size: 18px;
    letter-spacing: 0.3px;
    background: linear-gradient(135deg, #6c5ce7, #a55eea);
    color: white;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
  }
  .btn-ai-giant:hover { filter: brightness(1.08); }
  .btn-ai-giant:disabled { opacity: 0.6; cursor: not-allowed; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.amount-positive { color: var(--positive); font-weight: 600; }
  td.amount-negative { color: var(--negative); font-weight: 600; }
  .empty-hint { color: var(--muted); font-size: 13px; }
  #cardSummary { font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
  #cardSummary strong { color: var(--text); }
  .badge-card {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(108, 92, 231, 0.2);
    color: #b9a7ff;
    margin-left: 6px;
  }

  #analysisContainer {
    background: #12141c;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    line-height: 1.55;
    font-size: 14px;
  }
  #analysisContainer h1, #analysisContainer h2, #analysisContainer h3 {
    color: #b9a7ff;
  }
  #analysisContainer ul { padding-left: 20px; }
  .loading-text { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1117;
    color: var(--text);
    font-size: 14px;
  }
  .inline-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .inline-row > div { flex: 1; }
  .banner {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .banner-success { background: rgba(46, 204, 113, 0.12); color: var(--positive); border: 1px solid rgba(46, 204, 113, 0.35); }
  .banner-error { background: rgba(255, 107, 107, 0.12); color: var(--negative); border: 1px solid rgba(255, 107, 107, 0.35); }
  .linked-bank-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .linked-bank-bar span { font-size: 14px; }
  .btn-unlink {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 13px;
  }
  .btn-unlink:hover { color: var(--negative); border-color: var(--negative); }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h1>Money AI</h1>
    <p class="subtitle">Accede a tu panel de análisis financiero</p>
    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" required />
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="dashboard-header">
      <h1>Panel financiero</h1>
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>

    <!-- Vinculación de la cuenta bancaria real vía Enable Banking -->
    <div class="panel-section" id="bankLinkPanel">
      <div id="bankLinkBanner"></div>
      <label for="aspspCountry">País del banco (código ISO de 2 letras)</label>
      <div class="inline-row">
        <div>
          <input type="text" id="aspspCountry" value="ES" maxlength="2" />
        </div>
        <button class="btn-load" id="searchAspspsBtn" style="margin-bottom:16px;">Buscar bancos</button>
      </div>
      <label for="aspspSelect">Banco</label>
      <select id="aspspSelect"><option value="">-- Busca tu banco --</option></select>
      <button class="btn-primary" id="connectBankBtn" disabled>Conectar banco</button>
      <div id="bankLinkStatus" class="loading-text"></div>
    </div>

    <div class="panel-section hidden" id="linkedBankBar">
      <div class="linked-bank-bar">
        <span>🏦 Banco vinculado: <strong id="linkedBankName"></strong></span>
        <button class="btn-unlink" id="unlinkBankBtn">Desvincular banco</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="actions-row">
        <button class="btn-load" id="loadTransactionsBtn">Cargar Movimientos</button>
        <button class="btn-load hidden" id="filterAllBtn">Todos</button>
        <button class="btn-load hidden" id="filterCardBtn">💳 Solo tarjeta</button>
        <button class="btn-load hidden" id="filterAccountBtn">🏦 Solo cuenta</button>
      </div>
      <div id="transactionsStatus" class="loading-text"></div>
      <div id="cardSummary"></div>
      <div id="transactionsTableWrapper"></div>
    </div>

    <div class="panel-section">
      <button class="btn-ai-giant" id="analyzeBtn">🤖 Consultar IA</button>
      <div id="analysisStatus" class="loading-text"></div>
      <div id="analysisContainer" class="hidden"></div>
    </div>
  </div>

<script>
  const TOKEN_KEY = "moneyAiToken";

  const loginCard = document.getElementById("loginCard");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const logoutBtn = document.getElementById("logoutBtn");
  const loadTransactionsBtn = document.getElementById("loadTransactionsBtn");
  const filterAllBtn = document.getElementById("filterAllBtn");
  const filterCardBtn = document.getElementById("filterCardBtn");
  const filterAccountBtn = document.getElementById("filterAccountBtn");
  const transactionsStatus = document.getElementById("transactionsStatus");
  const cardSummary = document.getElementById("cardSummary");
  const transactionsTableWrapper = document.getElementById("transactionsTableWrapper");
  let loadedTransactions = [];
  let currentFilter = "all";
  const analyzeBtn = document.getElementById("analyzeBtn");
  const analysisStatus = document.getElementById("analysisStatus");
  const analysisContainer = document.getElementById("analysisContainer");

  const bankLinkPanel = document.getElementById("bankLinkPanel");
  const bankLinkBanner = document.getElementById("bankLinkBanner");
  const bankLinkStatus = document.getElementById("bankLinkStatus");
  const aspspCountryInput = document.getElementById("aspspCountry");
  const searchAspspsBtn = document.getElementById("searchAspspsBtn");
  const aspspSelect = document.getElementById("aspspSelect");
  const connectBankBtn = document.getElementById("connectBankBtn");
  const linkedBankBar = document.getElementById("linkedBankBar");
  const linkedBankName = document.getElementById("linkedBankName");
  const unlinkBankBtn = document.getElementById("unlinkBankBtn");

  // Logger de consola con prefijo y timestamp, para depurar el flujo completo desde el navegador
  function clog(scope, message, meta) {
    const prefix = `[${new Date().toISOString()}] [${scope}]`;
    if (meta !== undefined) console.log(prefix, message, meta);
    else console.log(prefix, message);
  }

  clog("boot", `Página cargada. Token de sesión en sessionStorage: ${getToken() ? "presente" : "ausente"}`);

  function getToken() {
    return sessionStorage.getItem(TOKEN_KEY);
  }

  function setToken(token) {
    sessionStorage.setItem(TOKEN_KEY, token);
  }

  function clearToken() {
    sessionStorage.removeItem(TOKEN_KEY);
  }

  function showDashboard() {
    clog("ui", "Mostrando dashboard");
    loginCard.style.display = "none";
    dashboard.style.display = "block";
    handleBankLinkRedirectParams();
    refreshBankLinkStatus();
  }

  function showLogin() {
    clog("ui", "Mostrando pantalla de login");
    dashboard.style.display = "none";
    loginCard.style.display = "block";
  }

  // Escapa HTML para evitar inyección antes de aplicar el formato Markdown
  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Conversor de Markdown a HTML minimalista y seguro (sin dependencias externas)
  function renderMarkdown(rawMarkdown) {
    const escaped = escapeHtml(rawMarkdown);
    const lines = escaped.split("\n");
    let html = "";
    let inList = false;

    for (const line of lines) {
      const trimmed = line.trim();

      if (/^-\s+/.test(trimmed)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${inlineMarkdown(trimmed.replace(/^-\s+/, ""))}</li>`;
        continue;
      }
      if (inList) { html += "</ul>"; inList = false; }

      if (/^###\s+/.test(trimmed)) {
        html += `<h3>${inlineMarkdown(trimmed.replace(/^###\s+/, ""))}</h3>`;
      } else if (/^##\s+/.test(trimmed)) {
        html += `<h2>${inlineMarkdown(trimmed.replace(/^##\s+/, ""))}</h2>`;
      } else if (/^#\s+/.test(trimmed)) {
        html += `<h1>${inlineMarkdown(trimmed.replace(/^#\s+/, ""))}</h1>`;
      } else if (trimmed.length === 0) {
        html += "<br/>";
      } else {
        html += `<p>${inlineMarkdown(trimmed)}</p>`;
      }
    }

    if (inList) { html += "</ul>"; }
    return html;
  }

  function inlineMarkdown(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  async function apiFetch(url, options = {}) {
    const token = getToken();
    const headers = Object.assign({}, options.headers, {
      Authorization: `Bearer ${token}`,
    });
    const method = options.method || "GET";
    clog("api", `--> ${method} ${url}`);
    const start = performance.now();
    const response = await fetch(url, Object.assign({}, options, { headers }));
    const durationMs = Math.round(performance.now() - start);

    if (response.status === 401) {
      clog("api", `<-- ${method} ${url} 401 (${durationMs}ms): sesión expirada`);
      clearToken();
      showLogin();
      throw new Error("Sesión expirada, vuelve a iniciar sesión");
    }

    const data = await response.json();
    clog("api", `<-- ${method} ${url} ${response.status} (${durationMs}ms)`, data);
    if (!response.ok) {
      const apiError = new Error(data.error || "Error inesperado en la petición");
      apiError.code = data.code;
      throw apiError;
    }
    return data;
  }

  function showBankLinkBanner(type, message) {
    bankLinkBanner.innerHTML = message
      ? `<div class="banner banner-${type}">${escapeHtml(message)}</div>`
      : "";
  }

  async function refreshBankLinkStatus() {
    clog("bankLink", "Consultando estado de vinculación...");
    try {
      const data = await apiFetch("/api/bank-link/status");
      if (data.linked) {
        clog("bankLink", `Banco vinculado: ${data.aspsp.name} (${data.aspsp.country})`);
        bankLinkPanel.classList.add("hidden");
        linkedBankBar.classList.remove("hidden");
        linkedBankName.textContent = `${data.aspsp.name} (${data.aspsp.country})`;
      } else {
        clog("bankLink", "Sin banco vinculado, mostrando panel de vinculación");
        bankLinkPanel.classList.remove("hidden");
        linkedBankBar.classList.add("hidden");
      }
    } catch (error) {
      clog("bankLink", `Error consultando estado: ${error.message}`);
      bankLinkStatus.textContent = error.message;
    }
  }

  searchAspspsBtn.addEventListener("click", async () => {
    const country = aspspCountryInput.value.trim().toUpperCase();
    clog("bankLink", `Buscando bancos en país=${country}`);
    bankLinkStatus.textContent = "Buscando bancos...";
    aspspSelect.innerHTML = '<option value="">-- Busca tu banco --</option>';
    connectBankBtn.disabled = true;

    try {
      const data = await apiFetch(`/api/aspsps?country=${encodeURIComponent(country)}`);
      const aspsps = data.aspsps || [];
      clog("bankLink", `${aspsps.length} bancos encontrados para ${country}`);

      if (aspsps.length === 0) {
        bankLinkStatus.textContent = "No se encontraron bancos para ese país.";
        return;
      }

      bankLinkStatus.textContent = "";
      for (const aspsp of aspsps) {
        const option = document.createElement("option");
        option.value = JSON.stringify({ aspspName: aspsp.name, aspspCountry: aspsp.country });
        option.textContent = aspsp.name;
        aspspSelect.appendChild(option);
      }
    } catch (error) {
      clog("bankLink", `Error buscando bancos: ${error.message}`);
      bankLinkStatus.textContent = error.message;
    }
  });

  aspspSelect.addEventListener("change", () => {
    connectBankBtn.disabled = !aspspSelect.value;
  });

  connectBankBtn.addEventListener("click", async () => {
    if (!aspspSelect.value) return;
    const { aspspName, aspspCountry } = JSON.parse(aspspSelect.value);
    clog("bankLink", `Conectando con ${aspspName} (${aspspCountry})...`);

    connectBankBtn.disabled = true;
    bankLinkStatus.textContent = "Redirigiendo a tu banco...";

    try {
      const data = await apiFetch("/api/bank-link/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ aspspName, aspspCountry }),
      });
      clog("bankLink", `Redirigiendo el navegador a ${data.url}`);
      window.location.href = data.url;
    } catch (error) {
      bankLinkStatus.textContent = error.message;
      connectBankBtn.disabled = false;
    }
  });

  unlinkBankBtn.addEventListener("click", async () => {
    clog("bankLink", "Desvinculando banco...");
    try {
      await apiFetch("/api/bank-link/unlink", { method: "POST" });
      loadedTransactions = [];
      transactionsTableWrapper.innerHTML = "";
      cardSummary.innerHTML = "";
      transactionsStatus.textContent = "";
      [filterAllBtn, filterCardBtn, filterAccountBtn].forEach((btn) => btn.classList.add("hidden"));
      analysisContainer.classList.add("hidden");
      analysisContainer.innerHTML = "";
      await refreshBankLinkStatus();
    } catch (error) {
      clog("bankLink", `Error desvinculando: ${error.message}`);
      bankLinkStatus.textContent = error.message;
    }
  });

  // Procesa los parámetros ?linked=1 / ?linkError=... devueltos tras el callback del banco
  function handleBankLinkRedirectParams() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("linked")) {
      clog("bankLink", "Callback del banco: vinculación exitosa (?linked=1)");
      showBankLinkBanner("success", "¡Banco vinculado correctamente!");
    } else if (params.has("linkError")) {
      clog("bankLink", `Callback del banco: error (?linkError=${params.get("linkError")})`);
      showBankLinkBanner("error", params.get("linkError"));
    }
    if (params.has("linked") || params.has("linkError")) {
      window.history.replaceState({}, "", window.location.pathname);
    }
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    loginError.textContent = "";

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    clog("login", `Enviando login para usuario "${username}"...`);

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "No se pudo iniciar sesión");
      }

      clog("login", "Login correcto, token de sesión guardado");
      setToken(data.token);
      showDashboard();
    } catch (error) {
      clog("login", `Login fallido: ${error.message}`);
      loginError.textContent = error.message;
    }
  });

  logoutBtn.addEventListener("click", () => {
    clog("login", "Cerrando sesión");
    clearToken();
    loadedTransactions = [];
    transactionsTableWrapper.innerHTML = "";
    cardSummary.innerHTML = "";
    transactionsStatus.textContent = "";
    [filterAllBtn, filterCardBtn, filterAccountBtn].forEach((btn) => btn.classList.add("hidden"));
    analysisContainer.classList.add("hidden");
    analysisContainer.innerHTML = "";
    showLogin();
  });

  loadTransactionsBtn.addEventListener("click", async () => {
    clog("transactions", "Cargando movimientos...");
    transactionsStatus.textContent = "Cargando movimientos...";
    transactionsTableWrapper.innerHTML = "";

    try {
      const data = await apiFetch("/api/transactions");
      const transactions = data.transactions || [];
      const accountErrors = data.accountErrors || [];
      clog("transactions", `${transactions.length} movimientos recibidos, ${accountErrors.length} cuenta(s) con error`, { accountErrors });
      const errorsNote = accountErrors.length > 0
        ? ` ⚠️ No se pudieron cargar ${accountErrors.length} cuenta(s): ${accountErrors
            .map((e) => `${e.accountName} (${e.message})`)
            .join("; ")}`
        : "";

      if (transactions.length === 0) {
        transactionsStatus.textContent = errorsNote
          ? errorsNote.trim()
          : "";
        transactionsTableWrapper.innerHTML = '<p class="empty-hint">No se encontraron movimientos.</p>';
        return;
      }

      transactionsStatus.textContent = `${transactions.length} movimientos (últimos 6 meses), indexados en el RAG.${errorsNote}`;
      loadedTransactions = transactions;
      currentFilter = "all";
      filterAllBtn.classList.remove("hidden");
      filterCardBtn.classList.remove("hidden");
      filterAccountBtn.classList.remove("hidden");
      renderTransactions();
    } catch (error) {
      clog("transactions", `Error cargando movimientos: ${error.message} (code=${error.code ?? "-"})`);
      transactionsStatus.textContent = error.message;
      if (error.code === "BANK_NOT_LINKED") {
        bankLinkPanel.classList.remove("hidden");
      }
    }
  });

  function setFilter(filter) {
    clog("transactions", `Filtro cambiado a: ${filter}`);
    currentFilter = filter;
    [filterAllBtn, filterCardBtn, filterAccountBtn].forEach((btn) => btn.classList.remove("active"));
    if (filter === "card") filterCardBtn.classList.add("active");
    else if (filter === "account") filterAccountBtn.classList.add("active");
    else filterAllBtn.classList.add("active");
    renderTransactions();
  }

  filterAllBtn.addEventListener("click", () => setFilter("all"));
  filterCardBtn.addEventListener("click", () => setFilter("card"));
  filterAccountBtn.addEventListener("click", () => setFilter("account"));

  function renderTransactions() {
    const filtered = loadedTransactions.filter((tx) => {
      if (currentFilter === "card") return tx.accountType === "CARD";
      if (currentFilter === "account") return tx.accountType !== "CARD";
      return true;
    });

    cardSummary.innerHTML = buildCardSummary(loadedTransactions);

    if (filtered.length === 0) {
      transactionsTableWrapper.innerHTML = '<p class="empty-hint">No hay movimientos para este filtro.</p>';
      return;
    }

    transactionsTableWrapper.innerHTML = buildTransactionsTable(filtered);
  }

  function buildCardSummary(transactions) {
    const cardExpenseByCurrency = {};
    for (const tx of transactions) {
      if (tx.accountType === "CARD" && tx.amount < 0) {
        cardExpenseByCurrency[tx.currency] = (cardExpenseByCurrency[tx.currency] || 0) + Math.abs(tx.amount);
      }
    }
    const currencies = Object.keys(cardExpenseByCurrency);
    if (currencies.length === 0) return "";

    const parts = currencies.map((currency) => `<strong>${cardExpenseByCurrency[currency].toFixed(2)} ${escapeHtml(currency)}</strong>`);
    return `💳 Gasto total con tarjeta: ${parts.join(", ")}`;
  }

  function buildTransactionsTable(transactions) {
    const rows = transactions
      .map((tx) => {
        const amountClass = tx.amount < 0 ? "amount-negative" : "amount-positive";
        const amountText = `${tx.amount > 0 ? "+" : ""}${tx.amount.toFixed(2)}`;
        const isCard = tx.accountType === "CARD";
        const accountLabel = tx.accountName ? escapeHtml(tx.accountName) : "-";
        return `
          <tr>
            <td>${escapeHtml(tx.date || "")}</td>
            <td class="${amountClass}">${escapeHtml(amountText)}</td>
            <td>${escapeHtml(tx.currency || "")}</td>
            <td>${escapeHtml(tx.concept || "")}</td>
            <td>${accountLabel}${isCard ? '<span class="badge-card">💳 Tarjeta</span>' : ""}</td>
          </tr>`;
      })
      .join("");

    return `
      <table>
        <thead>
          <tr><th>Fecha</th><th>Importe</th><th>Divisa</th><th>Concepto</th><th>Cuenta</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  analyzeBtn.addEventListener("click", async () => {
    clog("analyze", "Consultando IA...");
    analyzeBtn.disabled = true;
    analysisStatus.textContent = "Consultando a la IA, esto puede tardar unos segundos...";
    analysisContainer.classList.add("hidden");
    analysisContainer.innerHTML = "";

    try {
      const data = await apiFetch("/api/analyze", { method: "POST" });
      clog("analyze", `Análisis recibido (${(data.analysis || "").length} caracteres)`);
      analysisStatus.textContent = "";
      analysisContainer.innerHTML = renderMarkdown(data.analysis || "");
      analysisContainer.classList.remove("hidden");
    } catch (error) {
      clog("analyze", `Error consultando IA: ${error.message} (code=${error.code ?? "-"})`);
      analysisStatus.textContent = error.message;
      if (error.code === "BANK_NOT_LINKED") {
        bankLinkPanel.classList.remove("hidden");
      }
    } finally {
      analyzeBtn.disabled = false;
    }
  });

  // Si ya existe un token de sesión guardado, se muestra el panel directamente
  if (getToken()) {
    clog("boot", "Token existente encontrado, mostrando dashboard directamente");
    showDashboard();
  }
</script>
</body>
</html>
